<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Analysis</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>Speech Analysis</h1>
        
        <div class="status-section">
            <div class="status-item">
                <span class="label">Status:</span>
                <span id="recordingStatus" class="status-value">Ready</span>
            </div>
            <div class="status-item">
                <span class="label">Last Record:</span>
                <span id="lastRecordTime" class="status-value">Never</span>
            </div>
        </div>

        <div class="buttons-section">
            <button id="recordBtn" class="btn btn-record">
                Start Recording
            </button>
            
            <button id="viewResultsBtn" class="btn btn-secondary" disabled>
                View Results
            </button>
            
            <button id="generateSummaryBtn" class="btn btn-secondary" disabled>
                Generate Summary
            </button>
        </div>

        <div class="progress-section" id="progressSection" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-text">Recording in progress...</div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
